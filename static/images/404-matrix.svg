<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#E1E0CC" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#888880" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#E1E0CC"/>
      <stop offset="100%" stop-color="#999990"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="700" fill="#000000"/>

  <!-- Radar and Vault Concentric Target Rings -->
  <circle cx="500" cy="350" r="320" fill="none" stroke="#222222" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="500" cy="350" r="260" fill="none" stroke="#333333" stroke-width="1.5"/>
  <circle cx="500" cy="350" r="180" fill="none" stroke="#555550" stroke-width="2"/>
  <circle cx="500" cy="350" r="90" fill="none" stroke="#E1E0CC" stroke-width="3" stroke-dasharray="12 6"/>

  <!-- Crosshair Reticle Lines -->
  <line x1="500" y1="30" x2="500" y2="670" stroke="#333333" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="50" y1="350" x2="950" y2="350" stroke="#333333" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Corner Brackets -->
  <path d="M 80 120 L 80 80 L 120 80" fill="none" stroke="#E1E0CC" stroke-width="4"/>
  <path d="M 920 120 L 920 80 L 880 80" fill="none" stroke="#E1E0CC" stroke-width="4"/>
  <path d="M 80 580 L 80 620 L 120 620" fill="none" stroke="#E1E0CC" stroke-width="4"/>
  <path d="M 920 580 L 920 620 L 880 620" fill="none" stroke="#E1E0CC" stroke-width="4"/>

  <!-- Center Vault Lock Hexagon -->
  <polygon points="500,285 555,317 555,382 500,415 445,382 445,317" fill="#151515" stroke="#E1E0CC" stroke-width="4"/>
  <circle cx="500" cy="350" r="28" fill="#E1E0CC"/>
  <rect x="495" y="345" width="10" height="24" fill="#000000" rx="3"/>

  <!-- Giant Bold 404 Typography -->
  <text x="500" y="380" 
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" 
        font-size="280" 
        font-weight="900" 
        letter-spacing="-10" 
        text-anchor="middle" 
        fill="url(#textGrad)" 
        stroke="#000000" 
        stroke-width="12" 
        paint-order="stroke fill">
    404
  </text>

  <!-- Technical Archival Overlays -->
  <text x="500" y="470" 
        font-family="monospace, 'Courier New'" 
        font-size="22" 
        font-weight="700" 
        letter-spacing="12" 
        text-anchor="middle" 
        fill="#E1E0CC">
    VAULT SECTOR UNRESOLVED
  </text>
  
  <text x="500" y="505" 
        font-family="monospace, 'Courier New'" 
        font-size="14" 
        letter-spacing="6" 
        text-anchor="middle" 
        fill="#888880">
    ERR: 0x404_INDEX_KEY_NOT_FOUND // CORRIDOR_DISCONNECTED
  </text>
</svg>
